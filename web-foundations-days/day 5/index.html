
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 | User Directory</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Load and filter users from a REST API.</p>
    </header>

    <main>
        <section aria-labelledby="users-heading">
            <h2 id="users-heading">Users</h2>

            <button type="button" id="load-users">Load Users</button>

            <div>
                <label for="filter-input">Filter users by name:</label>
                <input
                    type="text"
                    id="filter-input"
                    placeholder="Type a name..."
                >
            </div>

            <p id="status" role="status" aria-live="polite">
                Click "Load Users" to get started.
            </p>

            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 User Directory | Day 5 Assignment</p>
    </footer>
</body>
</html>
